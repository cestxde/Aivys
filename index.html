<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>aivys</title>
  <script>
    // Pick the theme before anything paints (see src/utils/theme.ts, same key),
    // so a dark theme on a light system never flashes white.
    (function () {
      var preference = null;
      try {
        preference = localStorage.getItem("aivys.theme");
      } catch (e) { }
      var dark = preference === "dark"
        || (preference !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.dataset.theme = dark ? "dark" : "light";
    })();
  </script>
  <style>
    /* Boot splash: rendered before any JS/CSS bundle loads so the window
         never flashes white on startup. Mirrors the app theme. */
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #ffffff;
    }

    #boot-splash {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      z-index: 9999;
    }

    #boot-splash img {
      height: 48px;
      width: auto;
      display: block;
    }

    #boot-splash .splash-on-dark {
      display: none;
    }

    /* Matches --bg of the dark theme in src/index.css. */
    [data-theme="dark"],
    [data-theme="dark"] body,
    [data-theme="dark"] #boot-splash {
      background: #101014;
    }

    [data-theme="dark"] #boot-splash .splash-on-light {
      display: none;
    }

    [data-theme="dark"] #boot-splash .splash-on-dark {
      display: block;
    }
  </style>
</head>

<body>
  <div id="boot-splash">
    <img class="splash-on-light" src="/src/assets/logo-black-en.svg" alt="" />
    <img class="splash-on-dark" src="/src/assets/logo-white-en.svg" alt="" />
  </div>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
