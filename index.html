<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>aivys</title>
  <script>
    // Pick the theme and the logo before anything paints, with the same keys as
    // src/utils/theme.ts and src/i18n: a dark theme on a light system never
    // flashes white, and the boot logo is already the chosen one.
    (function () {
      function read(key) {
        try {
          return localStorage.getItem(key);
        } catch (e) {
          return null;
        }
      }
      var root = document.documentElement;
      var theme = read("aivys.theme");
      var dark = theme === "dark"
        || (theme !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
      root.dataset.theme = dark ? "dark" : "light";

      var language = read("aivys.language")
        || (navigator.language.toLowerCase().indexOf("ru") === 0 ? "ru" : "en");
      root.lang = language;
      root.dataset.logo = read("aivys.logo") || language;
    })();
  </script>
  <style>
    /* Boot splash: rendered before any JS/CSS bundle loads so the window
         never flashes white on startup. Mirrors the app theme. */
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #ffffff;
    }

    #boot-splash {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      z-index: 9999;
    }

    /* One of four logos: theme × logo language. */
    #boot-splash img {
      height: 48px;
      width: auto;
      display: none;
    }

    [data-theme="light"][data-logo="en"] #boot-splash .splash-light.splash-en,
    [data-theme="light"][data-logo="ru"] #boot-splash .splash-light.splash-ru,
    [data-theme="dark"][data-logo="en"] #boot-splash .splash-dark.splash-en,
    [data-theme="dark"][data-logo="ru"] #boot-splash .splash-dark.splash-ru {
      display: block;
    }

    /* Matches --bg of the dark theme in src/index.css. */
    [data-theme="dark"],
    [data-theme="dark"] body,
    [data-theme="dark"] #boot-splash {
      background: #101014;
    }
  </style>
</head>

<body>
  <div id="boot-splash">
    <img class="splash-light splash-en" src="/src/assets/logo-black-en.svg" alt="" />
    <img class="splash-dark splash-en" src="/src/assets/logo-white-en.svg" alt="" />
    <img class="splash-light splash-ru" src="/src/assets/logo-black-ru.svg" alt="" />
    <img class="splash-dark splash-ru" src="/src/assets/logo-white-ru.svg" alt="" />
  </div>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
