[[permission]]
identifier = "allow-library-store"
description = "Allows reading and writing the library's .aivys data (favorites, ratings, plays, tags, playlists, settings), searching it, editing track tags and moving tracks to the trash"
commands.allow = [
  "get_library_settings",
  "set_artist_rules",
  "default_artist_rules",
  "resolve_conflicts",
  "record_play",
  "record_complete",
  "set_rating",
  "set_favorite",
  "set_track_tag",
  "get_track_stats",
  "list_tags",
  "create_tag",
  "update_tag",
  "delete_tag",
  "list_playlists",
  "create_manual_playlist",
  "create_smart_playlist",
  "rename_playlist",
  "set_playlist_sort",
  "set_playlist_rules",
  "add_to_playlist",
  "remove_from_playlist",
  "reorder_playlist",
  "delete_playlist",
  "set_playlist_cover",
  "clear_playlist_cover",
  "get_smart_playlist_tracks",
  "preview_smart_playlist",
  "search_tracks",
  "delete_tracks",
  "edit_tracks",
  "undo_track_edit",
]
